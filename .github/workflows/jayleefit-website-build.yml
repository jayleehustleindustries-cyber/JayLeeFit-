name: Build JayLeeFit Website

on:
  push:
    branches:
      - claude/jaylee-fit-website-build-aor3la
      - claude/fitness-airtable-client-data-g1iot3
    paths:
      - "jayleefit-website/**"
      - ".github/workflows/jayleefit-website-build.yml"
  pull_request:
    branches:
      - claude/fitness-airtable-client-data-g1iot3
    paths:
      - "jayleefit-website/**"

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18.x]

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install dependencies
        working-directory: jayleefit-website
        run: npm install

      - name: Build Next.js project
        working-directory: jayleefit-website
        run: npm run build

      - name: Check build output
        working-directory: jayleefit-website
        run: test -d .next && echo "✓ Build successful"
