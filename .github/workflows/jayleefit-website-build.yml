name: Build JayLeeFit Website

on:
  push:
    branches:
      - claude/jaylee-fit-website-build-aor3la
      - claude/fitness-airtable-client-data-g1iot3
  pull_request:
    branches:
      - claude/fitness-airtable-client-data-g1iot3

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"

      - name: Install dependencies
        run: |
          cd "$GITHUB_WORKSPACE/jayleefit-website"
          npm install

      - name: Build Next.js project
        run: |
          cd "$GITHUB_WORKSPACE/jayleefit-website"
          npm run build

      - name: Verify build output
        run: |
          cd "$GITHUB_WORKSPACE/jayleefit-website"
          if [ -d ".next" ]; then
            echo "✓ Build successful - .next directory exists"
            exit 0
          else
            echo "✗ Build failed - .next directory not found"
            exit 1
          fi
