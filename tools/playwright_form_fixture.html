<!doctype html>
<html><head><meta charset="utf-8"><title>Marketplace Listing Fixture</title></head>
<body>
  <main>
    <h1>Create listing</h1>
    <form>
      <label>Title <input name="title"></label>
      <label>Price <input name="price" type="number"></label>
      <label>Description <textarea name="description"></textarea></label>
      <label>Images <input name="images" type="text"></label>
      <button type="button" id="save">Save draft</button>
      <button type="submit" id="publish">Publish listing</button>
    </form>
  </main>
</body></html>
